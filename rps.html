<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <style>
        /* Base Layout Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a83c9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Main Game Card Container */
        .game-card {
            background-color: #f5f1f3;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
        }

        /* Scoreboard Layout */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }

        .score-box {
            font-size: 1.1rem;
            color: #495057;
        }

        .score-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            display: block;
            margin-top: 5px;
        }

        /* Choice Action Buttons */
        .choices-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .choice-btn {
            background-color: #ffffff;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 15px;
            font-size: 2.5rem; /* Large Emojis */
            cursor: pointer;
            transition: all 0.2s ease;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .choice-btn:hover {
            border-color: #3498db;
            transform: translateY(-3px);
            background-color: #f1f9ff;
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        /* Visual Display Results */
        .results-display {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 15px;
            min-height: 28px;
        }

        .outcome-message {
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 35px;
        }

        /* Outcome Visual Colors */
        .win { color: #2ecc71; }
        .lose { color: #e74c3c; }
        .draw { color: #f39c12; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Rock, Paper, Scissors</h1>

        <!-- Live Score Tracking -->
        <div class="scoreboard">
            <div class="score-box">Player <span id="playerScore" class="score-number">0</span></div>
            <div class="score-box">Computer <span id="computerScore" class="score-number">0</span></div>
        </div>

        <!-- Interactive Choice Buttons -->
        <div class="choices-container">
            <button class="choice-btn" data-choice="rock">🪨</button>
            <button class="choice-btn" data-choice="paper">📃</button>
            <button class="choice-btn" data-choice="scissors">✂️</button>
        </div>

        <!-- Match Readout Text -->
        <div id="resultsText" class="results-display">Choose an emoji to start the game!</div>
        <div id="outcomeText" class="outcome-message"></div>
    </div>

    <script>
        // --- 1. Game State Variables ---
        let pScore = 0;
        let cScore = 0;

        // An array of valid gameplay items to pick from
        const choices = ['rock', 'paper', 'scissors'];
        
        // Map strings to their respective display emojis
        const emojiMap = {
            rock: '✊',
            paper: '✋',
            scissors: '✌️'
        };

        // --- 2. DOM Elements Selection ---
        const playerScoreEl = document.getElementById('playerScore');
        const computerScoreEl = document.getElementById('computerScore');
        const resultsText = document.getElementById('resultsText');
        const outcomeText = document.getElementById('outcomeText');
        const choiceButtons = document.querySelectorAll('.choice-btn');

        // --- 3. Core Logic Functions ---
        function getComputerChoice() {
            const randomIndex = Math.floor(Math.random() * choices.length);
            return choices[randomIndex];
        }

        function playRound(playerChoice) {
            const computerChoice = getComputerChoice();
            
            // Render what both entities threw into the arena
            resultsText.innerHTML = `You chose <b>${emojiMap[playerChoice]}</b> | Computer chose <b>${emojiMap[computerChoice]}</b>`;

            // --- 4. Evaluate Win / Loss Matrix ---
            if (playerChoice === computerChoice) {
                outcomeText.textContent = "It's a draw! 🤝";
                outcomeText.className = "outcome-message draw";
            } 
            else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                outcomeText.textContent = "You win this round! 🎉";
                outcomeText.className = "outcome-message win";
                pScore++;
                playerScoreEl.textContent = pScore;
            } 
            else {
                outcomeText.textContent = "Computer wins this round! 🤖";
                outcomeText.className = "outcome-message lose";
                cScore++;
                computerScoreEl.textContent = cScore;
            }
        }

        // --- 5. Event Listeners ---
        // Attaching a click action to all selection buttons seamlessly
        choiceButtons.forEach(button => {
            button.addEventListener('click', function() {
                const selectedMove = this.getAttribute('data-choice');
                playRound(selectedMove);
            });
        });
    </script>

</body>
</html>
